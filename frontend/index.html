<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HandoffAI Enterprise - React Frontend</title>

  <!-- Google Fonts & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          fontFamily: {
            "body-md": ["Inter", "sans-serif"],
            "body-sm": ["Inter", "sans-serif"],
            "headline-sm": ["Inter", "sans-serif"],
            "headline-md": ["Inter", "sans-serif"],
            "headline-lg": ["Inter", "sans-serif"],
            "display-lg": ["Inter", "sans-serif"],
            "code-stream": ["JetBrains Mono", "monospace"],
            "label-code": ["JetBrains Mono", "monospace"],
            "badge-label": ["Inter", "sans-serif"]
          },
        }
      }
    };
  </script>

  <!-- React & ReactDOM (UMD via CDN) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel for parsing JSX in the browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @layer base {
      html, body { margin: 0; padding: 0; }
      body { overscroll-behavior: none; }
    }
    ::-webkit-scrollbar { display: none; }
    @keyframes flow {
      0% { stroke-dashoffset: 24; }
      100% { stroke-dashoffset: 0; }
    }
    .animate-pipeline-flow {
      stroke-dasharray: 6 6;
      animation: flow 1.2s linear infinite;
    }
  </style>
</head>
<body class="bg-[#f8fafc] font-body-md text-slate-800 antialiased selection:bg-cyan-100 selection:text-cyan-900">
  <div id="root"></div>

  <!-- Load the React Application Code -->
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
